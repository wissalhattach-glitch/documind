spring.application.name=documind
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/documind
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
app.storage.dir=./storage
spring.data.web.pageable.max-page-size=50
app.upload.max-pages=500
app.ollama.url=http://localhost:11434
app.embedding.model=bge-m3